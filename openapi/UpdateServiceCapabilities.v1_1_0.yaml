    UpdateServiceCapabilities_v1_1_0_AllowableTargetReferenceType:
      enum:
      - SoftwareInventory
      - DeviceResource
      - ResourceCollection
      - Aggregate
      - ComputerSystem
      type: string
      x-enumDescriptions:
        Aggregate: The service accepts URIs that reference `Aggregate` resources as
          valid values for the `Targets` parameter.
        ComputerSystem: The service accepts URIs that reference `ComputerSystem` resources
          as valid values for the `Targets` parameter.
        DeviceResource: The service accepts URIs that reference device resources,
          such as `NetworkAdapter`, `Processor`, `Storage`, or `Drive` resources,
          as valid values for the `Targets` parameter.
        ResourceCollection: The service accepts URIs that reference resource collections,
          such as `NetworkAdapterCollection`, `ProcessorCollection`, `StorageCollection`,
          or `DriveCollection` resources, as valid values for the `Targets` parameter.
        SoftwareInventory: The service accepts URIs that reference `SoftwareInventory`
          resources as valid values for the `Targets` parameter.
      x-enumLongDescriptions:
        Aggregate: This value shall indicate that the service accepts URIs that reference
          `Aggregate` resources as valid values for the `Targets` parameter.
        ComputerSystem: This value shall indicate that the service accepts URIs that
          reference `ComputerSystem` resources as valid values for the `Targets` parameter.
        DeviceResource: This value shall indicate that the service accepts URIs that
          reference device resources, such as `NetworkAdapter`, `Processor`, `Storage`,
          or `Drive` resources, as valid values for the `Targets` parameter.
        ResourceCollection: This value shall indicate that the service accepts URIs
          that reference resource collections, such as `NetworkAdapterCollection`,
          `ProcessorCollection`, `StorageCollection`, or `DriveCollection` resources,
          as valid values for the `Targets` parameter.
        SoftwareInventory: This value shall indicate that the service accepts URIs
          that reference `SoftwareInventory` resources as valid values for the `Targets`
          parameter.
