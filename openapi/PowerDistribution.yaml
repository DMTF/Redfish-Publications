components:
  schemas:
    PowerDistribution_PowerDistribution:
      $ref: http://redfish.dmtf.org/schemas/v1/PowerDistribution.v1_7_0.yaml#/components/schemas/PowerDistribution_v1_7_0_PowerDistribution
      description: The `PowerDistribution` schema contains the definitions for a power
        distribution component or unit, such as a floor power distribution unit (PDU)
        or switchgear.
      x-longDescription: This resource shall represent a power distribution component
        or unit for a Redfish implementation.
    PowerDistribution_PowerState:
      enum:
      - 'On'
      - 'Off'
      - PowerCycle
      type: string
      x-enumDescriptions:
        'Off': Power off.
        'On': Power on.
        PowerCycle: Power cycle.
      x-enumLongDescriptions:
        PowerCycle: This value shall indicate the resource will transition to a power
          off state, then transition to a power on state.  The transition to a power
          on state shall be delayed by the value of the `PowerCycleDelaySeconds` property,
          if present in the resource.
title: '#PowerDistribution.PowerDistribution'
