          oneOf:
          - $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          - enum:
            - null
          readOnly: true
        ExtentOffsetMiB:
          description: The offset of the memory extent in the device address range
            in mebibytes (MiB).
          format: int64
          readOnly: true
          type: integer
          x-longDescription: The value of this property shall contain the offset of
            the memory extent in the device address range in mebibytes (MiB).
          x-units: MiBy
        ExtentSizeMiB:
          description: The size of the memory extent in mebibytes (MiB).
          format: int64
          readOnly: true
          type: integer
          x-longDescription: This property shall contain the size of the memory extent
            in mebibytes (MiB).
          x-units: MiBy
        FMReferencedExtent:
          description: An indication of whether this memory extent is referenced by
            the CXL Fabric Manager.
          nullable: true
          readOnly: true
          type: boolean
          x-longDescription: This property shall indicate whether this memory extent
            is referenced by the CXL Fabric Manager.  If `true`, this memory extent
            cannot be sanitized, freed, or reallocated, regardless of whether it is
            currently assigned to any logical device.
        Id:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Id
          readOnly: true
        Links:
          $ref: '#/components/schemas/MemoryExtent_v1_0_0_Links'
