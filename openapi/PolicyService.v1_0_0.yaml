    PolicyService_v1_0_0_OperatingMode:
      enum:
      - Disabled
      - AlertOnly
      - Enabled
      type: string
      x-enumDescriptions:
        AlertOnly: The policy service is operating in alert only mode.
        Disabled: The policy service is disabled.
        Enabled: The policy service is fully enabled.
      x-enumLongDescriptions:
        AlertOnly: This value shall indicate that the policy service is operating
          in alert only mode and shall only perform responses of type `Event` or `Recheck`.  The
          underlying service implementation may still perform some actions as determined
          by the manufacturer, such as throttling on thermal events, in order to preserve
          the system.
        Disabled: This value shall indicate that the policy service is disabled and
          shall take no automatic action.  The underlying service implementation may
          still perform some actions as determined by the manufacturer, such as throttling
          on thermal events, in order to preserve the system.
        Enabled: This value shall indicate that the policy service is operating in
          autonomous mode where it performs all responses.
