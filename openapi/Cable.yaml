    Cable_Cable:
      $ref: http://redfish.dmtf.org/schemas/v1/Cable.v1_3_0.yaml#/components/schemas/Cable_v1_3_0_Cable
      description: The `Cable` schema contains properties that describe a cable connecting
        endpoints of a chassis, port, or any other cable-compatible endpoint.  The
        terms 'upstream' and 'downstream' in this schema are equivalent to 'initiator'
        and 'target', respectively, in other specifications.  For cases where two
        connected devices do not have such a relationship, such as two systems connected
        by a patch cable, the assignment of upstream versus downstream can be arbitrarily
        selected.
      x-longDescription: This resource contains a simple cable for a Redfish implementation.
