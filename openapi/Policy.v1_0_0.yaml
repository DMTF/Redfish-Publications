components:
  schemas:
    Policy_v1_0_0_Actions:
      additionalProperties: false
      description: The available actions for this resource.
      properties:
        Oem:
          $ref: '#/components/schemas/Policy_v1_0_0_OemActions'
          description: The available OEM-specific actions for this resource.
          x-longDescription: This property shall contain the available OEM-specific
            actions for this resource.
      type: object
      x-longDescription: This type shall contain the available actions for this resource.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_Condition:
      additionalProperties: false
      description: A condition to trigger the policy or a parent condition.
      properties:
        CompareValue:
          description: The value to compare against.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the value for the comparison
            operator to compare against for conditions with an operator.
        Operator:
          description: The comparison operator for this condition, if applicable.
          oneOf:
          - $ref: '#/components/schemas/Policy_v1_0_0_Operator'
          - enum:
            - null
          readOnly: false
          x-longDescription: This property shall contain the comparison operator for
            condition types that require comparisons.
        PropertyPath:
          description: The property path in the resource from which to obtain data.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the property path from which
            to obtain data.  The value shall follow RFC6901-defined JSON pointer notation
            rules.
        ResourcePath:
          description: The resource from which to obtain data.
          format: uri-reference
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the URI to a Redfish resource
            from which to obtain data.  If the resource is of type `Sensor` and the
            `Property` is not present, the `Reading` property from the `Sensor` reading
            shall be used.
        SubordinateConditions:
          description: Subordinate conditions that are evaluated to determine the
            status of this condition.
          items:
            oneOf:
            - $ref: '#/components/schemas/Policy_v1_0_0_Condition'
            - enum:
              - null
          type: array
          x-longDescription: This property shall contain an array of subordinate conditions
            that are evaluated to determine the status of this condition.
        Type:
          description: The type of this condition.
          oneOf:
          - $ref: http://redfish.dmtf.org/schemas/v1/Policy.yaml#/components/schemas/Policy_ConditionType
          - enum:
            - null
          readOnly: false
          x-longDescription: This property shall contain the type of this condition.
      type: object
      x-longDescription: This type shall contain properties that describe conditions
        for a policy.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_EventResponse:
      additionalProperties: false
      description: Parameters for an event response type.
      properties:
        MessageArgs:
          description: The message arguments to send in the event.
          items:
            nullable: true
            type: string
          readOnly: false
          type: array
          x-longDescription: This property shall contain the message arguments to
            send as the `MessageArgs` property in the event.
        MessageId:
          description: The identifier of the message to send in the event.
          nullable: true
          pattern: ^[A-Za-z0-9]+\.(\d+\.\d+\.)?[A-Za-z0-9]+$
          readOnly: false
          type: string
          x-longDescription: This property shall contain the identifier of the message
            to send as the `MessageId` property in the event.  If the value is in
            the `MessageRegistryPrefix.MessageKey` format, the service shall use the
            highest version of the message supported by the service.  If the value
            is in the `MessageRegistryPrefix.MajorVersion.MinorVersion.MessageKey`
            format, the service shall use the exact value in the event response.
        MessageOriginOfCondition:
          description: The origin of condition to send in the event.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the origin of condition to
            send as the `OriginOfCondition` property in the event.  If this property
            is not specified or is an empty string, the origin of condition shall
            be the URI of this policy.
      type: object
      x-longDescription: This type shall contain properties that describe the event
        to send as a response.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_HTTPHeaderProperty:
      additionalProperties: false
      description: The HTTP header value is the property value.  The header name is
        the property name.
      properties: {}
      type: object
      x-longDescription: This type shall contain the HTTP header name and value to
        include when performing an HTTP operation for a policy response.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
        ^[^:\s]+$: {}
    Policy_v1_0_0_HTTPResponse:
      additionalProperties: false
      description: Parameters for an HTTP/HTTPS response type.
      properties:
        Body:
          description: The body of the HTTP operation to perform.
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the body of HTTP/HTTPS operation
            to send.
        Headers:
          $ref: '#/components/schemas/Policy_v1_0_0_HTTPHeaderProperty'
          description: The HTTP headers to include when performing the HTTP operation.
          x-longDescription: This property shall contain an object consisting of the
            names and values of HTTP headers to include when performing the HTTP operation.  This
            property shall be an empty object in responses.
        Operation:
          description: The type of HTTP operation to perform.
          oneOf:
          - $ref: '#/components/schemas/Policy_v1_0_0_HTTPVerb'
          - enum:
            - null
          readOnly: false
          x-longDescription: This property shall contain the type of HTTP operation
            to perform.
      type: object
      x-longDescription: This type shall contain properties that describe the HTTP/HTTPS
        operation to perform as a response.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_HTTPVerb:
      enum:
      - GET
      - PATCH
      - POST
      - DELETE
      type: string
      x-enumDescriptions:
        DELETE: The response performs an HTTP `DELETE` operation.
        GET: The response performs an HTTP `GET` operation.
        PATCH: The response performs an HTTP `PATCH` operation.
        POST: The response performs an HTTP `POST` operation.
      x-enumLongDescriptions:
        DELETE: This value shall indicate that the response sends an HTTP `DELETE`
          operation as specified in RFC2616.
        GET: This value shall indicate that the response sends an HTTP `GET` operation
          as specified in RFC2616.
        PATCH: This value shall indicate that the response sends an HTTP `PATCH` operation
          as specified in RFC2616.
        POST: This value shall indicate that the response sends an HTTP `POST` operation
          as specified in RFC2616.
    Policy_v1_0_0_Links:
      additionalProperties: false
      description: The links to other resources that are related to this resource.
      properties:
        Oem:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All
            values for properties contained in this object shall conform to the Redfish
            Specification-described requirements.
      type: object
      x-longDescription: This Redfish Specification-described type shall contain links
        to resources that are related to but are not contained by, or subordinate
        to, this resource.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_OemActions:
      additionalProperties: true
      description: The available OEM-specific actions for this resource.
      properties: {}
      type: object
      x-longDescription: This type shall contain the available OEM-specific actions
        for this resource.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_Operator:
      enum:
      - Equal
      - NotEqual
      - GreaterThan
      - LessThan
      - GreaterThanOrEqual
      - LessThanOrEqual
      type: string
      x-enumDescriptions:
        Equal: Check whether the values to compare are equal.
        GreaterThan: Check whether the value calculated is greater than the value
          specified in the condition.
        GreaterThanOrEqual: Check whether the value calculated is greater than or
          equal to the value specified in the condition.
        LessThan: Check whether the value calculated is less than the value specified
          in the condition.
        LessThanOrEqual: Check whether the value calculated is less than or equal
          to the value specified in the condition.
        NotEqual: Check whether the values to compare not equal.
      x-enumLongDescriptions:
        Equal: This value shall indicate that the condition evaluates to true if the
          value calculated exactly matches the value specified by the condition.
        GreaterThan: This value shall indicate that the condition evaluates to true
          if the value calculated is greater than the value specified by the condition.  If
          both values evaluate to numbers, the service shall perform numeric comparison.  Otherwise,
          the service shall perform string comparison.
        GreaterThanOrEqual: This value shall indicate that the condition evaluates
          to true if the value calculated is greater than or equal to the value specified
          by the condition.  If both values evaluate to numbers, the service shall
          perform numeric comparison.  Otherwise, the service shall perform string
          comparison.
        LessThan: This value shall indicate that the condition evaluates to true if
          the value calculated is less than the value specified by the condition.  If
          both values evaluate to numbers, the service shall perform numeric comparison.  Otherwise,
          the service shall perform string comparison.
        LessThanOrEqual: This value shall indicate that the condition evaluates to
          true if the value calculated is less than or equal to the value specified
          by the condition.  If both values evaluate to numbers, the service shall
          perform numeric comparison.  Otherwise, the service shall perform string
          comparison.
        NotEqual: This value shall indicate that the condition evaluates to true if
          the value calculated does not match the value specified by the condition.
    Policy_v1_0_0_Policy:
      additionalProperties: false
      description: The `Policy` schema contains a definition for a policy.
      properties:
        '@odata.context':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_context
        '@odata.etag':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_etag
        '@odata.id':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_id
        '@odata.type':
          $ref: http://redfish.dmtf.org/schemas/v1/odata-v4.yaml#/components/schemas/odata-v4_type
        Actions:
          $ref: '#/components/schemas/Policy_v1_0_0_Actions'
          description: The available actions for this resource.
          x-longDescription: This property shall contain the available actions for
            this resource.
        Description:
          oneOf:
          - $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Description
          - enum:
            - null
          readOnly: true
        Enabled:
          description: An indication of whether the policy is enabled.
          nullable: true
          readOnly: false
          type: boolean
          x-longDescription: This property indicate whether the policy is enabled.  The
            value `true` shall indicate the service performs the actions specified
            by this policy.  The value `false` shall indicate the service takes no
            actions specified by this policy.
        Id:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Id
          readOnly: true
        Links:
          $ref: '#/components/schemas/Policy_v1_0_0_Links'
          description: The links to other resources that are related to this resource.
          x-longDescription: This property shall contain links to resources that are
            related to but are not contained by, or subordinate to, this resource.
        Name:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Name
          readOnly: true
        Oem:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All
            values for properties that this object contains shall conform to the Redfish
            Specification-described requirements.
        Predefined:
          description: An indication of whether the policy is predefined by Redfish
            or an OEM rather than a client-defined policy.
          nullable: true
          readOnly: true
          type: boolean
          x-longDescription: This property shall indicate whether the policy is predefined
            by Redfish or an OEM as contrasted with a client-defined policy.  If this
            property is not present, the value should be assumed to be `false`.
        Response:
          description: A list of responses to perform when the condition is triggered.
          items:
            oneOf:
            - $ref: '#/components/schemas/Policy_v1_0_0_Response'
            - enum:
              - null
          type: array
          x-longDescription: This property shall contain a list of responses to perform
            when the policy condition is triggered.  Services shall perform the responses
            sequentially.
        TriggerCondition:
          description: The condition that causes the service to perform the actions
            of this policy.
          oneOf:
          - $ref: '#/components/schemas/Policy_v1_0_0_Condition'
          - enum:
            - null
          x-longDescription: This property shall contain the condition that causes
            the service to perform the actions of this policy.
      required:
      - '@odata.id'
      - '@odata.type'
      - Id
      - Name
      type: object
      x-longDescription: This resource shall be used to represent a policy for a Redfish
        implementation.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
    Policy_v1_0_0_Response:
      additionalProperties: false
      description: A response that is executed in the order specified.
      properties:
        DelaySeconds:
          description: The delay in seconds before performing the response action.
          format: int64
          minimum: 0
          nullable: true
          readOnly: false
          type: integer
          x-longDescription: This property shall contain the number of seconds to
            wait before performing the response action.
          x-units: s
        Event:
          description: The event parameters for a response if the action type is `Event`.
          oneOf:
          - $ref: '#/components/schemas/Policy_v1_0_0_EventResponse'
          - enum:
            - null
          x-longDescription: This property shall contain the event parameters for
            a response if `ResponseAction` contains `Event`.  If `ResponseAction`
            does not contain `Event`, this property shall be ignored.
        HTTP:
          description: The HTTP/HTTPS parameters for a response if the action type
            is `HTTP`.
          oneOf:
          - $ref: '#/components/schemas/Policy_v1_0_0_HTTPResponse'
          - enum:
            - null
          x-longDescription: This property shall contain the HTTP/HTTPS parameters
            for a response if `ResponseAction` contains `HTTP`.  If `ResponseAction`
            does not contain `HTTP`, this property shall be ignored.
        Oem:
          $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_Oem
          description: The OEM extension property.
          x-longDescription: This property shall contain the OEM extensions.  All
            values for properties contained in this object shall conform to the Redfish
            Specification-described requirements.
        ResetType:
          description: The type of reset to perform if the action type is `Reset`.
          oneOf:
          - $ref: http://redfish.dmtf.org/schemas/v1/Resource.yaml#/components/schemas/Resource_ResetType
          - enum:
            - null
          readOnly: false
          x-longDescription: This property shall contain the type of reset to perform
            if `ResponseAction` contains `Reset`.  If `ResponseAction` does not contain
            `Reset`, this property shall be ignored.
        ResponseAction:
          description: The action type of this response.
          oneOf:
          - $ref: http://redfish.dmtf.org/schemas/v1/Policy.yaml#/components/schemas/Policy_ResponseAction
          - enum:
            - null
          readOnly: false
          x-longDescription: This property shall contain the action type of this response.
        TargetURI:
          description: The URI on which to perform the response action.
          format: uri-reference
          nullable: true
          readOnly: false
          type: string
          x-longDescription: This property shall contain the URI on which to perform
            the response action.
      type: object
      x-longDescription: This type shall contain properties that describe response
        to a policy.
      x-patternProperties:
        ^([a-zA-Z_][a-zA-Z0-9_]*)?@(odata|Redfish|Message)\.[a-zA-Z_][a-zA-Z0-9_]*$:
          description: This property shall specify a valid odata or Redfish property.
